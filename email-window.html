<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self';style-src 'self' 'unsafe-inline'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hexora Email</title><style>
*{box-sizing:border-box}body{margin:0;background:#11131d;color:white;font:13px system-ui}#rail{position:fixed;inset:0 auto 0 0;width:76px;background:var(--accent,#1c347f);display:flex;flex-direction:column;align-items:center;gap:11px;padding:13px 7px;z-index:2}button{cursor:pointer}#rail button{border:0;background:#ffffff18;color:#fff;width:48px;height:48px;border-radius:12px;font-size:24px}#rail button.active{background:#ffffff36;outline:2px solid #fff9}#rail button:hover{background:#ffffff44}#rail button small{display:block;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#add{font-size:29px!important;background:transparent!important}#panel{display:none;position:fixed;top:24px;left:88px;width:325px;padding:20px;border-radius:16px;background:#202330;box-shadow:0 18px 60px #000a;z-index:5;border:1px solid #51566a}#panel.open{display:block}label{display:block;margin:12px 0 5px;color:#c4c9dc}input,select{width:100%;padding:10px;border:1px solid #5d6479;border-radius:8px;background:#131722;color:white}#palette{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}.swatch{height:26px;border-radius:7px;border:1px solid #ffffff66}.swatch.active{outline:2px solid white;outline-offset:2px}.actions{display:flex;gap:8px;margin-top:16px}.actions button{padding:10px 12px;border-radius:8px;border:0;background:#8264d8;color:#fff}.actions button.secondary{background:#414657}#error{color:#ffacb5;min-height:18px;margin-top:9px}#empty{position:fixed;left:76px;right:0;top:0;bottom:0;display:grid;place-items:center;color:#aeb6c9}#empty[hidden]{display:none}#manage{position:absolute;bottom:15px;width:48px;height:42px!important;font-size:19px!important}
</style></head><body><div id="rail"><div style="font-size:19px;font-weight:800;margin:4px 0 14px">✦</div><div id="accounts" style="display:flex;flex-direction:column;gap:11px;align-items:center;overflow:auto;flex:1;width:100%"></div><button id="add" title="Add email account">＋</button><button id="manage" title="Edit active account">⚙</button></div><div id="empty"><div><h2>Your email hub</h2><p>Add an account to begin.</p></div></div><div id="panel"><h2 id="heading">Add email account</h2><form id="form"><label>Provider</label><select id="service"><option value="gmail">Gmail</option><option value="outlook">Outlook</option><option value="proton">Proton Mail</option><option value="custom">Other webmail (HTTPS)</option></select><div id="custom-row" hidden><label>Webmail URL</label><input id="url" type="url" placeholder="https://mail.example.com"></div><label>Account label</label><input id="name" maxlength="48" placeholder="Work email"><label>Window accent colour</label><div id="palette"></div><label>Custom colour</label><input id="color" type="color" value="#1c347f"><div class="actions"><button type="submit" id="save">Add account</button><button type="button" id="cancel" class="secondary">Cancel</button><button type="button" id="remove" class="secondary" hidden>Remove</button></div><div id="error" role="alert"></div></form></div><script src="email-window.js"></script></body></html>
