<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>Hexora Notes</title><style>
:root{font:14px/1.5 'Segoe UI',Inter,system-ui,sans-serif;color:#e8efff;background:#090f1c;font-synthesis:none}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100vh;background:#090f1c}.side{background:linear-gradient(170deg,#0d1729,#0b1220);border-right:1px solid #26334b;display:flex;flex-direction:column;min-height:0}.brand{padding:29px 23px 19px}.eyebrow{color:#6fa6ff;font-size:10px;font-weight:800;letter-spacing:.27em}.brand h1{font-size:26px;letter-spacing:-.06em;margin:10px 0 7px;color:#fff;font-weight:750}.brand h1 span{color:#6eabff;margin-right:8px}.sub{color:#93a2bc;font-size:12px}.new{margin:5px 19px 18px;background:linear-gradient(115deg,#2676fa,#3269ed);color:white;border:1px solid #4e94ff;border-radius:11px;padding:12px;font-weight:700;box-shadow:0 8px 25px #145de533}.new:hover{filter:brightness(1.12)}.search{margin:0 19px 19px;padding:12px 14px;width:calc(100% - 38px);background:#152138;color:#e6efff;border:1px solid #2a3c59;border-radius:10px;outline:none}.search:focus{border-color:#4d88f5}.search::placeholder{color:#7f91ad}.list{overflow:auto;padding:0 11px 16px;flex:1}.item{width:100%;border:1px solid transparent;border-radius:11px;text-align:left;background:transparent;color:#dce8fc;padding:13px 14px;margin-bottom:5px;transition:background .15s}.item:hover{background:#182843}.item.active{background:linear-gradient(120deg,#1a345e,#1b2d4d);border-color:#386bb6}.item strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:650}.item small{display:block;color:#8fa3c3;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side-bottom{border-top:1px solid #26334b;padding:15px 23px;color:#6d85a7;font-size:11px}.editor{overflow:auto;min-width:0;background:radial-gradient(ellipse at 76% -20%,#162a4a 0,transparent 48%),#0a111f}.top{height:69px;padding:14px 34px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #223047;background:#0a1220b8;position:sticky;top:0;z-index:2;backdrop-filter:blur(14px)}.crumb{color:#a5b6d3;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb b{color:#f2f6ff;font-weight:700}.actions{display:flex;gap:9px;align-items:center}.status{font-size:11px;color:#7f9abc;margin-right:8px}.ghost{background:#142139;border:1px solid #2c4162;color:#b6c9e7;border-radius:9px;padding:8px 12px;font-size:12px}.ghost:hover{background:#243b61}.ghost.danger{color:#e8a0b0}.page{max-width:1100px;margin:0 auto;padding:30px 46px 80px}.cover{height:156px;border-radius:18px;background:radial-gradient(ellipse at 50% 125%,#4788ffbb 0,#123a80a0 20%,transparent 52%),radial-gradient(ellipse at 65% 90%,#254e9466,transparent 60%),linear-gradient(145deg,#0b1830,#0a1b36 70%,#0c1a2e);border:1px solid #243e68;position:relative;overflow:hidden;margin-bottom:27px}.cover:after{content:'';position:absolute;left:-12%;right:-12%;bottom:-105%;height:155%;border-radius:50%;border-top:2px solid #62a7ff;box-shadow:0 -9px 30px #327cff8c,0 -22px 65px #285ff74a;transform:rotate(-2deg)}.content{max-width:850px;margin:0 auto}.page-icon{font-size:30px;margin-bottom:8px;filter:grayscale(1);opacity:.86}.title{display:block;width:100%;font-size:clamp(32px,3.6vw,48px);font-weight:750;letter-spacing:-.055em;background:none;color:#f5f8ff;border:0;outline:none;padding:0;margin:0 0 10px}.title::placeholder{color:#6d7e9b}.meta{font-size:11px;color:#8499b9;margin-bottom:25px}.tools{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:25px;padding:7px 10px;background:#111e32;border:1px solid #2b3d59;border-radius:12px}.tools button{border:0;border-radius:7px;background:transparent;color:#b8c8e3;padding:8px 11px;font-size:12px;font-weight:650}.tools button:hover{background:#253c60;color:#fff}.tools button:nth-child(2),.tools button:nth-child(4),.tools button:nth-child(6){margin-right:8px}.body{display:block;width:100%;min-height:400px;resize:vertical;background:transparent;color:#dce7fa;border:0;outline:none;font:15px/1.85 'Segoe UI',system-ui,sans-serif;tab-size:2;padding:2px 0}.body::placeholder{color:#7285a4}.preview{display:none;color:#dce7fa;font-size:15px;line-height:1.85;overflow-wrap:anywhere;min-height:400px}.preview h1,.preview h2,.preview h3{letter-spacing:-.035em;margin:1em 0 .35em}.preview p{margin:0 0 .7em}.preview blockquote{border-left:3px solid #5e94ff;padding-left:14px;color:#afc0dc;margin:12px 0}.preview-mode .body{display:none}.preview-mode .preview{display:block}.hint{margin-top:28px;color:#637b9f;font-size:11px}.empty{padding:24px;color:#8399ba;font-size:12px}@media(max-width:850px){.app{grid-template-columns:225px minmax(0,1fr)}.page{padding:23px}.top{padding:12px 20px}.status{display:none}}@media(max-width:650px){.app{grid-template-columns:180px minmax(0,1fr)}.brand{padding:20px 14px}.new{margin:5px 10px 14px}.search{margin:0 10px 14px;width:calc(100% - 20px)}.page{padding:16px}.cover{height:95px}.actions{gap:3px}.ghost{padding:7px}.top{padding:8px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="eyebrow">H E X O R A</div><h1><span>▤</span>Notes</h1><div class="sub">Global notes for all workspaces.</div></div><button id="new" class="new">＋ New Note</button><input id="search" class="search" placeholder="⌕ Search notes…" aria-label="Search notes"><div id="list" class="list"></div><div class="side-bottom">✦ &nbsp; YOUR PRIVATE NOTEBOOK</div></aside><main class="editor"><div class="top"><div class="crumb">▤ &nbsp; Notes &nbsp; / &nbsp; <b id="crumb-title">Untitled</b></div><div class="actions"><span id="status" class="status">Ready</span><button id="pin" class="ghost">☆ Pin</button><button id="toggle" class="ghost">Preview</button><button id="delete" class="ghost danger">Delete</button></div></div><div class="page"><div class="cover"></div><div class="content"><div class="page-icon">▤</div><input id="title" class="title" placeholder="Untitled" maxlength="300" aria-label="Note title"><div id="meta" class="meta">Global note · saved locally</div><div class="tools"><button data-insert="# ">H1</button><button data-insert="## ">H2</button><button data-wrap="**">B</button><button data-wrap="*"><i>I</i></button><button data-insert="- ">☷ List</button><button data-insert="- [ ] ">☑ Task</button><button data-insert="> ">❝ Quote</button><button data-wrap="`">&lt;/&gt; Code</button></div><textarea id="body" class="body" placeholder="Start writing, or capture an idea…" spellcheck="true" aria-label="Note content"></textarea><div id="preview" class="preview"></div><div class="hint">Markdown supported · Ctrl+S to save · Autosaves as you type · Available across all workspaces</div></div></div></main></div>
<script>
const $=id=>document.getElementById(id);let notes=[],active=null,dirty=false,saveTimer=null,preview=false,version=0;
const plain=val=>String(val||'');const esc=s=>s;const make=(tag,text)=>{const el=document.createElement(tag);el.textContent=text;return el;};
function showStatus(text){$('status').textContent=text}
function sorted(){return [...notes].sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updatedAt-a.updatedAt)}
function list(){const term=$('search').value.toLowerCase();$('list').replaceChildren();const matches=sorted().filter(n=>(n.title+' '+n.body).toLowerCase().includes(term));if(!matches.length){$('list').append(make('div','No matching notes yet.'));return;}for(const n of matches){const item=document.createElement('button');item.className='item'+(active===n.id?' active':'');const title=make('strong',(n.pinned?'✦ ':'')+(n.title||'Untitled'));const snippet=make('small',n.body.trim().slice(0,90)||'Empty page');item.append(title,snippet);item.onclick=()=>select(n.id);$('list').append(item)}}
function renderPreview(){const box=$('preview');box.replaceChildren();for(const line of $('body').value.split('\n')){let tag='p',text=line;if(/^#{1,3} /.test(line)){const n=line.match(/^#+/)[0].length;tag='h'+n;text=line.slice(n+1)}else if(/^> /.test(line)){tag='blockquote';text=line.slice(2)}else if(/^- \[[ xX]\] /.test(line)){tag='p';text=(line[3]===' '?'☐ ':'☑ ')+line.slice(6)}else if(/^- /.test(line)){tag='p';text='• '+line.slice(2)}const el=make(tag,text||' ');box.append(el)}}
function select(id){if(dirty)save();active=id;const n=notes.find(n=>n.id===id);if(!n)return;$('title').value=n.title;$('crumb-title').textContent=n.title||'Untitled';$('body').value=n.body;$('pin').textContent=n.pinned?'★ Pinned':'☆ Pin';$('meta').textContent='Global note · Updated '+new Date(n.updatedAt).toLocaleString();showStatus('All changes saved');renderPreview();list()}
function fresh(){const id='note_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);notes.unshift({id,title:'',body:'',pinned:false,createdAt:Date.now(),updatedAt:Date.now()});active=id;dirty=true;select(id);$('title').focus()}
async function save(){if(!active)return;const n=notes.find(n=>n.id===active);if(!n)return;clearTimeout(saveTimer);n.title=$('title').value;n.body=$('body').value;const current=++version;dirty=false;showStatus('Saving…');try{const saved=await window.hexora.notes.request('save',n);n.updatedAt=saved.updatedAt;if(current===version)showStatus('✓ Saved locally');list()}catch(e){dirty=true;showStatus('Save failed — retry with Ctrl+S');console.error(e)}}
function changed(){if(document.activeElement===$('title'))$('crumb-title').textContent=$('title').value||'Untitled';dirty=true;showStatus('Unsaved changes');clearTimeout(saveTimer);saveTimer=setTimeout(save,550);renderPreview()}
function insert(before,after=''){const el=$('body'),start=el.selectionStart,end=el.selectionEnd,text=el.value.slice(start,end);el.setRangeText(before+text+after,start,end,'select');el.focus();changed()}
$('new').onclick=fresh;$('search').oninput=list;$('title').oninput=changed;$('body').oninput=changed;
$('pin').onclick=()=>{const n=notes.find(n=>n.id===active);if(!n)return;n.pinned=!n.pinned;$('pin').textContent=n.pinned?'★ Pinned':'☆ Pin';dirty=true;save()};
$('delete').onclick=async()=>{if(!active||!confirm('Delete this note permanently?'))return;const id=active;try{await window.hexora.notes.request('delete',id);notes=notes.filter(n=>n.id!==id);active=null;dirty=false;if(notes.length)select(sorted()[0].id);else fresh();list()}catch(e){showStatus('Delete failed');console.error(e)}};
$('toggle').onclick=()=>{preview=!preview;document.body.classList.toggle('preview-mode',preview);$('toggle').textContent=preview?'Edit':'Preview';renderPreview()};
document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>insert(b.dataset.insert));document.querySelectorAll('[data-wrap]').forEach(b=>b.onclick=()=>insert(b.dataset.wrap,b.dataset.wrap));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
window.addEventListener('blur',()=>{if(dirty)save()});
window.addEventListener('beforeunload',()=>{if(dirty)save()});
(async()=>{try{notes=await window.hexora.notes.request('list');if(notes.length)select(sorted()[0].id);else fresh();}catch(e){showStatus('Unable to load notes');console.error(e)}})();
</script></body></html>
