<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>Hexora Notes Studio</title><style>
:root{font:14px/1.55 Inter,'Segoe UI',system-ui,sans-serif;color:#e9eefb;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:285px minmax(0,1fr);height:100vh}.side{background:#10192b;border-right:1px solid #26344c;display:flex;flex-direction:column;min-height:0}.brand{padding:29px 22px 17px}.eyebrow{color:#8aa7ff;font-size:10px;font-weight:800;letter-spacing:.24em}.brand h1{margin:6px 0;font-size:25px;letter-spacing:-.06em}.sub{color:#8394b3;font-size:12px}.new{margin:6px 18px 15px;background:linear-gradient(115deg,#5277f8,#805df6);color:white;border:0;border-radius:12px;padding:12px;font-weight:750;box-shadow:0 7px 24px #3b56be40}.search{margin:0 18px 14px;padding:11px 13px;width:calc(100% - 36px);background:#19243a;color:#fff;border:1px solid #30415d;border-radius:11px;outline:none}.search:focus{border-color:#7a9dff}.list{overflow:auto;padding:0 10px 20px;flex:1}.item{width:100%;border:1px solid transparent;border-radius:12px;text-align:left;background:transparent;color:#d9e4f7;padding:12px;margin-bottom:5px}.item:hover{background:#1a2842}.item.active{background:#213459;border-color:#3e5b96}.item strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.item small{display:block;color:#8495b1;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.editor{overflow:auto;min-width:0;background:radial-gradient(ellipse at 90% 0,#1b2c52 0,transparent 50%),#0c1323}.top{height:74px;padding:17px 38px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #23334d}.status{font-size:12px;color:#8fa5c5}.actions{display:flex;gap:9px}.ghost{background:#192742;border:1px solid #304667;color:#b8cdf2;border-radius:10px;padding:8px 12px}.ghost:hover{background:#263d65}.ghost.danger{color:#ff9ba8}.page{max-width:850px;margin:0 auto;padding:46px 48px 90px}.cover{height:130px;border-radius:19px;background:radial-gradient(circle at 25% 70%,#72b9ff55,transparent 35%),radial-gradient(circle at 76% 22%,#b66cff66,transparent 38%),linear-gradient(120deg,#15244b,#334785,#1a2447);border:1px solid #4b68a2;margin-bottom:29px}.page-icon{font-size:34px;margin-bottom:14px}.title{width:100%;font-size:clamp(28px,4vw,43px);font-weight:800;letter-spacing:-.055em;background:none;color:#f4f7ff;border:0;outline:none;padding:0;margin-bottom:9px}.title::placeholder{color:#7787a3}.meta{font-size:11px;color:#8c9dbb;margin-bottom:26px}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;padding:8px;background:#15213a;border:1px solid #30405c;border-radius:13px}.tools button{border:0;border-radius:8px;background:transparent;color:#c4d4f2;padding:7px 11px;font-size:12px;font-weight:750}.tools button:hover{background:#2b4269}.body{display:block;width:100%;min-height:380px;resize:vertical;background:transparent;color:#e1eaf9;border:0;outline:none;font:15px/1.9 ui-monospace,Consolas,monospace;tab-size:2}.body::placeholder{color:#657a9b}.preview{display:none;color:#e1eaf9;font-size:15px;line-height:1.8;overflow-wrap:anywhere}.preview h1,.preview h2,.preview h3{letter-spacing:-.04em;margin:1em 0 .35em}.preview p{margin:0 0 .7em}.preview blockquote{border-left:3px solid #668cff;padding-left:14px;color:#a9bcdb;margin:12px 0}.preview ul{padding-left:22px}.preview code{background:#1c2d49;border-radius:5px;padding:2px 5px}.preview .check{color:#7bd3bd}.preview-mode .body{display:none}.preview-mode .preview{display:block}.hint{margin-top:25px;color:#7185a8;font-size:12px}.empty{padding:30px;color:#7e91b0;text-align:center;font-size:12px}@media(max-width:760px){.app{grid-template-columns:200px minmax(0,1fr)}.page{padding:25px}.top{padding:12px 20px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="eyebrow">HEXORA / GLOBAL</div><h1>✦ Notes Studio</h1><div class="sub">One notebook. Every workspace.</div></div><button id="new" class="new">＋ New page</button><input id="search" class="search" placeholder="⌕ Search your notes…" aria-label="Search notes"><div id="list" class="list"></div></aside><main class="editor"><div class="top"><span id="status" class="status">Ready</span><div class="actions"><button id="pin" class="ghost">☆ Pin</button><button id="toggle" class="ghost">Preview</button><button id="delete" class="ghost danger">Delete</button></div></div><div class="page"><div class="cover"></div><div class="page-icon">📝</div><input id="title" class="title" placeholder="Untitled" maxlength="300" aria-label="Note title"><div id="meta" class="meta">Global note · saved locally</div><div class="tools"><button data-insert="# ">H1</button><button data-insert="## ">H2</button><button data-wrap="**">Bold</button><button data-wrap="*">Italic</button><button data-insert="- ">List</button><button data-insert="- [ ] ">Task</button><button data-insert="> ">Quote</button><button data-wrap="`">Code</button></div><textarea id="body" class="body" placeholder="Start writing…&#10;&#10;# Heading&#10;- [ ] Your first task&#10;- A thought worth keeping" spellcheck="true" aria-label="Note content"></textarea><div id="preview" class="preview"></div><div class="hint">Write in Markdown · Ctrl+S to save · autosaves as you type · notes are shared across all Hexora workspaces</div></div></main></div>
<script>
const $=id=>document.getElementById(id);let notes=[],active=null,dirty=false,saveTimer=null,preview=false,version=0;
const plain=val=>String(val||'');const esc=s=>s;const make=(tag,text)=>{const el=document.createElement(tag);el.textContent=text;return el;};
function showStatus(text){$('status').textContent=text}
function sorted(){return [...notes].sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updatedAt-a.updatedAt)}
function list(){const term=$('search').value.toLowerCase();$('list').replaceChildren();const matches=sorted().filter(n=>(n.title+' '+n.body).toLowerCase().includes(term));if(!matches.length){$('list').append(make('div','No matching notes yet.'));return;}for(const n of matches){const item=document.createElement('button');item.className='item'+(active===n.id?' active':'');const title=make('strong',(n.pinned?'✦ ':'')+(n.title||'Untitled'));const snippet=make('small',n.body.trim().slice(0,90)||'Empty page');item.append(title,snippet);item.onclick=()=>select(n.id);$('list').append(item)}}
function renderPreview(){const box=$('preview');box.replaceChildren();for(const line of $('body').value.split('\n')){let tag='p',text=line;if(/^#{1,3} /.test(line)){const n=line.match(/^#+/)[0].length;tag='h'+n;text=line.slice(n+1)}else if(/^> /.test(line)){tag='blockquote';text=line.slice(2)}else if(/^- \[[ xX]\] /.test(line)){tag='p';text=(line[3]===' '?'☐ ':'☑ ')+line.slice(6)}else if(/^- /.test(line)){tag='p';text='• '+line.slice(2)}const el=make(tag,text||' ');box.append(el)}}
function select(id){if(dirty)save();active=id;const n=notes.find(n=>n.id===id);if(!n)return;$('title').value=n.title;$('body').value=n.body;$('pin').textContent=n.pinned?'★ Pinned':'☆ Pin';$('meta').textContent='Global note · Updated '+new Date(n.updatedAt).toLocaleString();showStatus('All changes saved');renderPreview();list()}
function fresh(){const id='note_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);notes.unshift({id,title:'',body:'',pinned:false,createdAt:Date.now(),updatedAt:Date.now()});active=id;dirty=true;select(id);$('title').focus()}
async function save(){if(!active)return;const n=notes.find(n=>n.id===active);if(!n)return;clearTimeout(saveTimer);n.title=$('title').value;n.body=$('body').value;const current=++version;dirty=false;showStatus('Saving…');try{const saved=await window.hexora.notes.request('save',n);n.updatedAt=saved.updatedAt;if(current===version)showStatus('✓ Saved locally');list()}catch(e){dirty=true;showStatus('Save failed — retry with Ctrl+S');console.error(e)}}
function changed(){dirty=true;showStatus('Unsaved changes');clearTimeout(saveTimer);saveTimer=setTimeout(save,550);renderPreview()}
function insert(before,after=''){const el=$('body'),start=el.selectionStart,end=el.selectionEnd,text=el.value.slice(start,end);el.setRangeText(before+text+after,start,end,'select');el.focus();changed()}
$('new').onclick=fresh;$('search').oninput=list;$('title').oninput=changed;$('body').oninput=changed;
$('pin').onclick=()=>{const n=notes.find(n=>n.id===active);if(!n)return;n.pinned=!n.pinned;$('pin').textContent=n.pinned?'★ Pinned':'☆ Pin';dirty=true;save()};
$('delete').onclick=async()=>{if(!active||!confirm('Delete this note permanently?'))return;const id=active;try{await window.hexora.notes.request('delete',id);notes=notes.filter(n=>n.id!==id);active=null;dirty=false;if(notes.length)select(sorted()[0].id);else fresh();list()}catch(e){showStatus('Delete failed');console.error(e)}};
$('toggle').onclick=()=>{preview=!preview;document.body.classList.toggle('preview-mode',preview);$('toggle').textContent=preview?'Edit':'Preview';renderPreview()};
document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>insert(b.dataset.insert));document.querySelectorAll('[data-wrap]').forEach(b=>b.onclick=()=>insert(b.dataset.wrap,b.dataset.wrap));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
window.addEventListener('beforeunload',()=>{if(dirty)save()});
(async()=>{try{notes=await window.hexora.notes.request('list');if(notes.length)select(sorted()[0].id);else fresh();}catch(e){showStatus('Unable to load notes');console.error(e)}})();
</script></body></html>
