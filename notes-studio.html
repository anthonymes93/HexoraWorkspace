<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>Hexora Notes</title><style>
:root{font:14px/1.5 'Segoe UI',Inter,system-ui,sans-serif;color:#eef3ff;background:#080e1b}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:78px 320px minmax(0,1fr);background:#080e1b}.rail{display:flex;flex-direction:column;align-items:center;gap:17px;padding:26px 0;background:linear-gradient(180deg,#061d53,#102d7b 70%,#071b4c);border-right:1px solid #2454a2;position:relative}.rail:after{content:'';position:absolute;bottom:30px;left:18px;width:42px;height:2px;background:#70c7ff;box-shadow:0 0 18px 7px #317eff55;border-radius:50%}.rail-logo{font-size:27px;color:#77bdff;font-weight:900;margin-bottom:20px}.rail-icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#dce8ff;font-size:23px;border:1px solid transparent}.rail-icon.active{border-color:#4ca1ff;background:#1c4f9b;box-shadow:0 0 20px #298bff55}.rail-icon.muted{opacity:.75}.side{background:linear-gradient(145deg,#0d172a,#0a1220);border-right:1px solid #263651;display:flex;flex-direction:column;min-height:0}.brand{padding:30px 30px 21px}.eyebrow{font-size:11px;letter-spacing:.27em;color:#7caaff;font-weight:800}.brand h1{margin:10px 0 6px;font-size:31px;letter-spacing:-.055em;line-height:1.2}.brand h1 span{font-size:27px;margin-right:10px;font-weight:400}.sub{font-size:13px;color:#a1b0cb}.new{margin:4px 30px 18px;padding:12px;border:1px solid #508aff;border-radius:12px;background:linear-gradient(125deg,#287aff,#2465f3);color:white;font-weight:750;box-shadow:0 10px 22px #1a61e02d}.new:hover{filter:brightness(1.1)}.search-wrap{margin:0 30px 18px;position:relative}.search{width:100%;padding:12px 70px 12px 15px;border:1px solid #2d3e5c;border-radius:11px;background:#152137;color:#e8f0ff;outline:none}.search:focus{border-color:#468dff}.search::placeholder{color:#92a1bc}.shortcut{position:absolute;right:13px;top:12px;color:#92a3be;font-size:11px}.list{overflow:auto;flex:1;padding:0 20px}.item{width:100%;padding:14px 16px;margin:3px 0;border:1px solid transparent;border-radius:12px;background:transparent;color:#edf3ff;text-align:left}.item:hover{background:#172741}.item.active{background:linear-gradient(120deg,#1a3157,#1b2b49);border-color:#3869ad}.item strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{display:block;color:#91a3c2;font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side-bottom{padding:22px 30px;border-top:1px solid #25344b;color:#a6b6d2;font-size:12px}.side-bottom span{display:block;margin-bottom:10px}.tag{display:inline-block;padding:4px 9px;border-radius:7px;background:#172d54;color:#76b6ff;font-weight:650;margin-right:5px}.editor{min-width:0;overflow:auto;position:relative;background:radial-gradient(ellipse at 70% -25%,#142544,transparent 55%),#090f1d}.top{height:70px;display:flex;justify-content:space-between;align-items:center;padding:0 32px;border-bottom:1px solid #23314a;background:#0b1220bb;position:sticky;top:0;z-index:3;backdrop-filter:blur(12px)}.crumb{color:#b8c6de;font-size:14px}.crumb b{color:#fff}.crumb .arrows{font-size:20px;letter-spacing:12px;color:#a9b8d0;margin-right:18px}.actions{display:flex;align-items:center;gap:12px}.status{color:#90a4c5;font-size:11px}.ghost{background:transparent;color:#d1def4;border:1px solid transparent;padding:8px 11px;border-radius:9px}.ghost:hover{background:#1b2d4c}.ghost.danger{color:#eaa1af}.save{background:#2878ff;color:white;border:1px solid #4b95ff;border-radius:11px;padding:11px 20px;font-weight:750;box-shadow:0 5px 18px #286eff33}.page{max-width:1290px;margin:0 auto;padding:24px 34px 70px}.cover{height:164px;border-radius:19px;background:radial-gradient(ellipse at 50% 160%,#2f78ed88,transparent 48%),linear-gradient(160deg,#0b182d,#091a34 80%);border:1px solid #263c60;position:relative;overflow:hidden;margin-bottom:30px}.cover:after{content:'';position:absolute;left:-10%;width:120%;height:175%;bottom:-135%;border-top:3px solid #64b5ff;border-radius:50%;box-shadow:0 -9px 25px #268affb3,0 -25px 55px #247fff4d}.content{max-width:1110px;margin:0 auto;padding:0 20px}.page-icon{font-size:34px;color:#dfeaff;margin-bottom:8px}.title{display:block;width:100%;font-size:clamp(38px,4vw,53px);font-weight:760;letter-spacing:-.06em;background:transparent;color:#f5f8ff;border:0;outline:0;padding:0;margin:0 0 12px}.title::placeholder{color:#e8edfa}.meta{font-size:12px;color:#94a7c5;margin-bottom:30px}.tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:28px;padding:8px 12px;border:1px solid #2d3f5c;background:#121d31;border-radius:13px}.tools button{background:none;border:0;color:#cbd8ee;padding:8px 12px;font-size:15px;border-radius:7px}.tools button:hover{background:#263d61}.tools button:nth-child(3),.tools button:nth-child(5){border-right:1px solid #3c4b64;border-radius:0;padding-right:20px;margin-right:8px}.body{display:block;width:100%;min-height:350px;resize:vertical;border:0;outline:0;background:transparent;color:#e4edfb;font:16px/1.9 'Segoe UI',system-ui,sans-serif;padding:4px 0}.body::placeholder{color:#778aa9}.preview{display:none;min-height:350px;color:#e4edfb;font-size:16px;line-height:1.85;overflow-wrap:anywhere}.preview h1,.preview h2{letter-spacing:-.04em}.preview blockquote{border-left:3px solid #619cff;padding-left:16px;color:#aabedc}.preview-mode .body{display:none}.preview-mode .preview{display:block}.hint{font-size:11px;color:#657e9e;margin-top:28px}.footer{display:flex;justify-content:space-between;color:#8c9fbd;font-size:12px;margin-top:40px}.empty{padding:20px;color:#9badc7}@media(max-width:1100px){.app{grid-template-columns:62px 255px minmax(0,1fr)}.rail-icon{width:42px;height:42px}.brand{padding:22px}.new{margin:4px 22px 15px}.search-wrap{margin:0 22px 15px}.page{padding:22px}.content{padding:0 8px}.top{padding:0 20px}.actions{gap:4px}}@media(max-width:750px){.app{grid-template-columns:48px 175px minmax(0,1fr)}.rail{gap:8px}.rail-icon{width:38px}.brand{padding:16px 12px}.brand h1{font-size:22px}.new{margin:0 10px 12px}.search-wrap{margin:0 10px 12px}.side-bottom{padding:12px}.page{padding:15px}.cover{height:105px}.content{padding:0}.top{padding:0 10px}.status,.crumb .arrows{display:none}.ghost{padding:6px}.save{padding:8px}.tools button{padding:6px}}
</style></head><body><div class="app"><nav class="rail" aria-label="Notes navigation"><div class="rail-logo">✣</div><div class="rail-icon muted" title="Hexora">⌂</div><div class="rail-icon muted" title="Workspaces">▦</div><div class="rail-icon muted" title="Time Intelligence">◷</div><div class="rail-icon active" title="Notes">▤</div><div class="rail-icon muted" title="Hexora">⌘</div><div class="rail-icon muted" title="More">◇</div></nav><aside class="side"><div class="brand"><div class="eyebrow">HEXORA</div><h1><span>▤</span>Notes</h1><div class="sub">Global notes for all workspaces.</div></div><button id="new" class="new">＋ New Note</button><div class="search-wrap"><input id="search" class="search" placeholder="⌕ Search notes…" aria-label="Search notes"><span class="shortcut">Ctrl K</span></div><div id="list" class="list"></div><div class="side-bottom"><span>⌗ Tags</span><span class="tag"># work</span><span class="tag"># ideas</span><span class="tag"># notes</span></div></aside><main class="editor"><div class="top"><div class="crumb"><span class="arrows">‹ ›</span>▤ &nbsp; Notes &nbsp; / &nbsp; <b id="crumb-title">Untitled</b></div><div class="actions"><span id="status" class="status">Ready</span><button id="pin" class="ghost">☆ Pin</button><button id="toggle" class="ghost">Preview</button><button id="delete" class="ghost danger">Delete</button><button id="save-button" class="save">✓ Save</button></div></div><div class="page"><div class="cover"></div><div class="content"><div class="page-icon">▤</div><input id="title" class="title" placeholder="Untitled" maxlength="300" aria-label="Note title"><div id="meta" class="meta">Global note · saved locally</div><textarea id="body" class="body" placeholder="Start writing, or type / for commands…" spellcheck="true" aria-label="Note content"></textarea><div id="preview" class="preview"></div><div class="footer"><span>Autosaves as you type · Available in all workspaces</span><span id="word-count">0 words</span></div><div class="hint">Markdown supported · Ctrl+S to save · Ctrl+K to search</div></div></div></main></div><script>
const $=id=>document.getElementById(id);let notes=[],active=null,dirty=false,saveTimer=null,preview=false,version=0;
const plain=val=>String(val||'');const esc=s=>s;const make=(tag,text)=>{const el=document.createElement(tag);el.textContent=text;return el;};
function showStatus(text){$('status').textContent=text}
function sorted(){return [...notes].sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updatedAt-a.updatedAt)}
function list(){const term=$('search').value.toLowerCase();$('list').replaceChildren();const matches=sorted().filter(n=>(n.title+' '+n.body).toLowerCase().includes(term));if(!matches.length){$('list').append(make('div','No matching notes yet.'));return;}for(const n of matches){const item=document.createElement('button');item.className='item'+(active===n.id?' active':'');const title=make('strong',(n.pinned?'✦ ':'')+(n.title||'Untitled'));const snippet=make('small',n.body.trim().slice(0,90)||'Empty page');item.append(title,snippet);item.onclick=()=>select(n.id);$('list').append(item)}}
function updateCount(){const n=$('body').value.trim().split(/\s+/).filter(Boolean).length;$('word-count').textContent=n+' word'+(n===1?'':'s')}
function renderPreview(){const box=$('preview');box.replaceChildren();for(const line of $('body').value.split('\n')){let tag='p',text=line;if(/^#{1,3} /.test(line)){const n=line.match(/^#+/)[0].length;tag='h'+n;text=line.slice(n+1)}else if(/^> /.test(line)){tag='blockquote';text=line.slice(2)}else if(/^- \[[ xX]\] /.test(line)){tag='p';text=(line[3]===' '?'☐ ':'☑ ')+line.slice(6)}else if(/^- /.test(line)){tag='p';text='• '+line.slice(2)}const el=make(tag,text||' ');box.append(el)}}
function select(id){if(dirty)save();active=id;const n=notes.find(n=>n.id===id);if(!n)return;$('title').value=n.title;$('crumb-title').textContent=n.title||'Untitled';$('body').value=n.body;$('pin').textContent=n.pinned?'★ Pinned':'☆ Pin';$('meta').textContent='Global note · Updated '+new Date(n.updatedAt).toLocaleString();showStatus('All changes saved');renderPreview();updateCount();list()}
function fresh(){const id='note_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);notes.unshift({id,title:'',body:'',pinned:false,createdAt:Date.now(),updatedAt:Date.now()});active=id;dirty=true;select(id);$('title').focus()}
async function save(){if(!active)return;const n=notes.find(n=>n.id===active);if(!n)return;clearTimeout(saveTimer);n.title=$('title').value;n.body=$('body').value;const current=++version;dirty=false;showStatus('Saving…');try{const saved=await window.hexora.notes.request('save',n);n.updatedAt=saved.updatedAt;if(current===version)showStatus('✓ Saved locally');list()}catch(e){dirty=true;showStatus('Save failed — retry with Ctrl+S');console.error(e)}}
function changed(){if(document.activeElement===$('title'))$('crumb-title').textContent=$('title').value||'Untitled';dirty=true;showStatus('Unsaved changes');clearTimeout(saveTimer);saveTimer=setTimeout(save,550);renderPreview();updateCount()}
function insert(before,after=''){const el=$('body'),start=el.selectionStart,end=el.selectionEnd,text=el.value.slice(start,end);el.setRangeText(before+text+after,start,end,'select');el.focus();changed()}
$('save-button').onclick=save;
$('new').onclick=fresh;$('search').oninput=list;$('title').oninput=changed;$('body').oninput=changed;
$('pin').onclick=()=>{const n=notes.find(n=>n.id===active);if(!n)return;n.pinned=!n.pinned;$('pin').textContent=n.pinned?'★ Pinned':'☆ Pin';dirty=true;save()};
$('delete').onclick=async()=>{if(!active||!confirm('Delete this note permanently?'))return;const id=active;try{await window.hexora.notes.request('delete',id);notes=notes.filter(n=>n.id!==id);active=null;dirty=false;if(notes.length)select(sorted()[0].id);else fresh();list()}catch(e){showStatus('Delete failed');console.error(e)}};
$('toggle').onclick=()=>{preview=!preview;document.body.classList.toggle('preview-mode',preview);$('toggle').textContent=preview?'Edit':'Preview';renderPreview()};
$('search').addEventListener('keydown',e=>{if(e.key==='Escape'){$('search').value='';list()}});
document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>insert(b.dataset.insert));document.querySelectorAll('[data-wrap]').forEach(b=>b.onclick=()=>insert(b.dataset.wrap,b.dataset.wrap));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus();$('search').select()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
window.addEventListener('blur',()=>{if(dirty)save()});
window.addEventListener('beforeunload',()=>{if(dirty)save()});
(async()=>{try{notes=await window.hexora.notes.request('list');if(notes.length)select(sorted()[0].id);else fresh();}catch(e){showStatus('Unable to load notes');console.error(e)}})();
</script></body></html>
