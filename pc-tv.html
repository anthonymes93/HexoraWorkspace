<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';">
<title>Hexora · PC TV</title><link rel="stylesheet" href="pc-tv.css"></head>
<body><header id="controls">
<div class="identity"><span class="mark">✦</span><span><strong>PC TV</strong><small>HEXORA ENTERTAINMENT</small></span></div>
<nav aria-label="TV controls">
<button data-cmd="back" title="Back">‹</button><button data-cmd="forward" title="Forward">›</button>
<button data-cmd="home" class="home">▶ YouTube</button>
<button data-cmd="reload" title="Reload">↻</button>
</nav><div class="right"><span class="hint">YOUR SCREEN. YOUR CHANNEL.</span>
<button data-cmd="fullscreen" id="fullscreen">⛶ Fullscreen</button>
<button data-cmd="controls" data-value="false" title="Hide toolbar (F10 to restore)">Hide bar</button>
<button data-cmd="minimize" title="Minimize">−</button>
<button data-cmd="maximize" title="Maximize">□</button>
<button data-cmd="close" title="Close">×</button>
</div></header><div id="tv-tabs" aria-label="PC TV tabs"></div><div id="collapsed" hidden>Press F10 to show PC TV controls</div>
<script src="pc-tv-ui.js"></script></body></html>
