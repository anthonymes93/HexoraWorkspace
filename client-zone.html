<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Work Zone</title><style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 23%,#292343 0%,#14141e 55%,#101018 100%);color:#f5f3ff;display:grid;place-items:center;padding:35px}.wrap{width:min(780px,100%);margin-top:-9vh;text-align:center}.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#a99bd2}.symbol{font-size:32px;color:#b9a6fb;margin-bottom:18px}h1{font-size:clamp(32px,4vw,52px);font-weight:650;letter-spacing:-.045em;margin:12px 0}p{color:#a6a0b6;margin:0 0 35px}.search{display:flex;align-items:center;background:#262435;border:1px solid #73648e99;border-radius:18px;padding:7px 12px 7px 20px;box-shadow:0 18px 65px #0005,0 0 0 4px #ab91e908}.search:focus-within{border-color:#b49aff}.search span{font-size:25px;color:#ad9acb}.search input{width:100%;border:0;outline:0;background:none;color:white;font-size:17px;padding:16px}.search input::placeholder{color:#8f899f}button{font:inherit;cursor:pointer}.add{border:1px solid #786a98;border-radius:11px;background:#a48bdd25;color:#e4d8ff;padding:12px 17px;white-space:nowrap}.add:hover{background:#a48bdd48}.results{text-align:left;margin-top:24px;display:grid;gap:10px}.result{display:flex;justify-content:space-between;gap:16px;align-items:center;border:1px solid #ffffff18;border-radius:13px;padding:17px 20px;background:#ffffff08;color:inherit;text-align:left}.result:hover{background:#ffffff12}.result strong{display:block;font-size:15px}.result small{display:block;color:#aaa4ba;margin-top:6px}.empty{text-align:center;color:#928ba7;padding:35px 0;font-size:13px}.hint{margin-top:22px;color:#827b95;font-size:12px}</style></head><body><main class="wrap"><div class="symbol">▦</div><div class="eyebrow">Hexora / Client management</div><h1>Client Work Zone</h1><p>Every client, project and connection. One place.</p><div class="search"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="Search clients, businesses, domains or contacts…" autofocus aria-label="Search clients"><button id="add" class="add" type="button">＋ New client</button></div><section id="results" class="results" aria-live="polite"></section><div class="hint">Your client directory is saved locally in Hexora for now.</div></main><script src="client-zone.js"></script></body></html>
