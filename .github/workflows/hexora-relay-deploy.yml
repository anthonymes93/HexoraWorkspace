name: Deploy Hexora update relay
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'cloudflare/hexora-update-relay/**'
      - '.github/workflows/hexora-relay-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/hexora-update-relay
          command: deploy
